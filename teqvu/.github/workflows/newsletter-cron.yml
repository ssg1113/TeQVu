name: Newsletter Scheduled Dispatch Check

on:
  schedule:
    # Runs every 15 minutes to check if any user-entered delivery time has arrived
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TeQVu Newsletter Cron Endpoint
        run: |
          SITE_URL="${{ secrets.SITE_URL || 'https://teqvu.vercel.app' }}"
          echo "Evaluating scheduled dispatches at $SITE_URL/api/newsletter/cron..."
          RESPONSE=$(curl -s -L -w "\nHTTP_STATUS:%{http_code}" "$SITE_URL/api/newsletter/cron")
          echo "$RESPONSE"
